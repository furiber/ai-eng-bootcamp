services:
  - type: web
    runtime: docker
    name: ask-api
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Prompted for in the Render dashboard on first deploy; never stored here.
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: gpt-4o-mini

  - type: web
    runtime: docker
    name: week-1-assignment
    plan: free
    region: oregon
    # Build context and Dockerfile both come from this subdirectory.
    rootDir: week-1-assignment
    healthCheckPath: /health
    # Without this, every commit anywhere in the repo rebuilds this service.
    buildFilter:
      paths:
        - week-1-assignment/**
    envVars:
      # Prompted for in the Render dashboard on first deploy; never stored here.
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: gpt-4o-mini
